<!-- `#ds-main-content` is the target of the header's "Skip to main content" link. -->
<ds-header [navItems]="navItems()">
  <a dsBrand routerLink="/spaces" class="fw-bold text-body text-decoration-none">Novan CMS</a>
  <ng-container dsActions>
    <nv-space-switcher />
    <ds-button variant="secondary" size="sm" (pressed)="signOut()">Sign out</ds-button>
  </ng-container>
</ds-header>

<main id="ds-main-content" class="container py-6">
  <router-outlet />
</main>
