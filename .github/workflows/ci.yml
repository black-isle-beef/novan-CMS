name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # nrwl/nx-set-shas reads earlier workflow runs to find the last successful `main` commit.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          cache-name: lint-test-build
      # test-bundle: client sites' browser bundles must not contain API tokens (package 09).
      - run: npx nx affected -t lint test build test-bundle --parallel=3

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          cache-name: database
      # A required check, so the job always reports; the Supabase steps only run when the schema, its types or the
      # Supabase CLI version can have changed. Pushes to main always run them.
      - name: Schema changed
        id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] \
            || [ -n "$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- supabase libs/shared/types package-lock.json .github/workflows/ci.yml)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=database::Skipped: nothing under supabase/, libs/shared/types/ or package-lock.json changed."
          fi
      - name: Supabase CLI version from package-lock.json
        if: steps.changed.outputs.run == 'true'
        id: supabase-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/supabase'].version")" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: steps.changed.outputs.run == 'true'
        with:
          version: ${{ steps.supabase-version.outputs.version }}
      # Postgres, Auth and Storage: Auth and Storage own the `auth` and `storage` schemas the migrations use. Kong
      # stays up because start and db reset seed the config.toml buckets (and their objects) through the gateway.
      - name: Start Supabase
        if: steps.changed.outputs.run == 'true'
        run: supabase start -x realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset
        if: steps.changed.outputs.run == 'true'
      - name: pgTAP tests
        if: steps.changed.outputs.run == 'true'
        run: supabase test db
      - name: Schema lint
        if: steps.changed.outputs.run == 'true'
        run: supabase db lint --level warning --fail-on warning
      - name: Generated database types are up to date
        if: steps.changed.outputs.run == 'true'
        run: |
          npm run db:types
          git diff --exit-code -- libs/shared/types/src/lib/database.types.ts \
            || { echo "::error::database.types.ts is out of date. Run 'npm run db:types' and commit the result."; exit 1; }

  audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          cache-name: audits
      - name: SCSS and Angular compliance audit (affected Angular projects)
        shell: pwsh
        run: ./tools/ci/audit-angular.ps1 -Affected

  # The starter site's content model (apps/starter-site/novan/schema) against the staging starter space, so code and
  # CMS models stay in sync (package 19). Signs in as a CI account with the developer role and no second factor.
  # When a change adds to the model, push it to staging (`novan schema push`, docs/clients/new-site.md) in the same PR.
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOVAN_API_URL: ${{ vars.NOVAN_STAGING_API_URL }}
      NOVAN_SPACE: ${{ vars.NOVAN_STAGING_STARTER_SPACE_ID }}
      NOVAN_EMAIL: ${{ secrets.NOVAN_CI_EMAIL }}
      NOVAN_PASSWORD: ${{ secrets.NOVAN_CI_PASSWORD }}
    steps:
      - name: Staging is configured
        id: configured
        run: |
          if [ -n "$NOVAN_API_URL" ] && [ -n "$NOVAN_SPACE" ] && [ -n "$NOVAN_EMAIL" ] && [ -n "$NOVAN_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=schema drift::Skipped: set NOVAN_STAGING_API_URL and NOVAN_STAGING_STARTER_SPACE_ID (variables) and NOVAN_CI_EMAIL and NOVAN_CI_PASSWORD (secrets)."
          fi
      - uses: actions/checkout@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        if: steps.configured.outputs.ok == 'true'
        with:
          cache-name: schema-drift
      - run: npx nx build novan-cli
        if: steps.configured.outputs.ok == 'true'
      - name: novan schema diff (starter site against staging)
        if: steps.configured.outputs.ok == 'true'
        working-directory: apps/starter-site
        run: node ../../dist/tools/novan-cli/main.cjs schema diff --exit-code

  # Chromium only on every change; firefox and webkit run nightly (e2e-nightly.yml). Runs alongside `database`
  # rather than after it: it starts its own Supabase.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
        with:
          cache-name: e2e
      # A required check, so the job always reports. Schema and e2e-stack changes belong to no Nx project, so they
      # run every e2e project; otherwise only the affected ones, and nothing (no Supabase, no browsers) if none are.
      - name: e2e projects to run
        id: plan
        run: |
          if [ -n "$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- supabase .github/actions .github/workflows/ci.yml)" ]; then
            echo "mode=run-many" >> "$GITHUB_OUTPUT"
          elif [ -n "$(npx nx show projects --affected -t e2e)" ]; then
            echo "mode=affected" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=e2e::Skipped: no e2e project is affected."
          fi
      - uses: ./.github/actions/e2e-stack
        if: steps.plan.outputs.mode != ''
        with:
          browsers: ${{ env.E2E_BROWSERS }}
      # Each e2e target starts what it needs: the admin and API dev servers (Playwright webServer / Nx
      # continuous tasks). One project at a time, because admin-e2e and api-e2e share the API port.
      - name: e2e (Playwright + axe)
        if: steps.plan.outputs.mode != ''
        run: npx nx ${{ steps.plan.outputs.mode }} -t e2e --parallel=1
        # The API purges the CDN through the fake Cloudflare API that api-e2e starts and checks
        # (apps/api-e2e/src/support/fake-cloudflare.ts). Outside api-e2e nothing listens there: the worker
        # retries those purge jobs with back-off and logs "Purge by tag failed ... fetch failed", which is expected.
        env:
          CLOUDFLARE_ZONE_ID: e2e-zone
          CLOUDFLARE_API_TOKEN: e2e-token
          CLOUDFLARE_API_URL: http://127.0.0.1:54399/client/v4
      - name: Upload Playwright traces and reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ github.run_id }}
          path: dist/.playwright/
          retention-days: 14
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans the commits in this PR or push for live (verified) and unverifiable credentials. No blobless clone here:
      # trufflehog re-clones the checkout and reads every blob, which a partial clone cannot serve.
      # trufflehog-exclude.txt lists files whose fake credentials are test inputs; keep it to exact paths.
      - uses: trufflesecurity/trufflehog@v3.99.2
        with:
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt

  # Non-blocking: reports high and critical advisories in production dependencies as a PR comment.
  # Not a required check; the job goes red so the finding is visible, but merging is not blocked.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm audit
        id: audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > npm-audit.txt 2>&1
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"
          cat npm-audit.txt
      - name: Comment on the PR
        # Fork PRs get a read-only token, so they only see the job result.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- ci:npm-audit -->';
            const failed = process.env.AUDIT_EXIT_CODE !== '0';
            const report = fs.readFileSync('npm-audit.txt', 'utf8').trim().slice(-60000);
            const body = failed
              ? `${marker}\n### npm audit: high or critical advisories in production dependencies\n\nThis check does not block merging.\n\n\`\`\`\n${report}\n\`\`\``
              : `${marker}\n### npm audit: no high or critical advisories in production dependencies`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else if (failed) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail when advisories were found
        if: steps.audit.outputs.exit-code != '0'
        run: |
          echo "::warning title=npm audit::High or critical advisories in production dependencies (non-blocking)."
          exit 1
