version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Angular packages must move together (and with angular-eslint / ng-packagr).
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'angular-eslint'
          - 'ng-packagr'
      # Nx plugins must match the nx version exactly.
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      # NestJS packages peer-depend on the same major version.
      nestjs:
        patterns:
          - '@nestjs/*'
      # @vitest/* packages pin vitest to the exact same version.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      # Types must match the Node runtime (24, see .nvmrc); move them with a Node upgrade.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
