<section class="novan-hero-block__inner" [attr.aria-labelledby]="headingText() ? headingId : null">
  @if (imageUrl(); as src) {
    <img
      class="novan-hero-block__image"
      [src]="src"
      alt="{{ imageAlt() }}"
      [attr.width]="image()?.width ?? null"
      [attr.height]="image()?.height ?? null"
      fetchpriority="high"
      decoding="async"
    />
  }

  <div class="novan-hero-block__content container">
    @if (headingText(); as heading) {
      @switch (resolved().headingLevel) {
        @case ('h2') {
          <h2 class="novan-hero-block__heading" [id]="headingId">{{ heading }}</h2>
        }
        @default {
          <h1 class="novan-hero-block__heading" [id]="headingId">{{ heading }}</h1>
        }
      }
    }
    @if (subheadingText(); as subheading) {
      <p class="novan-hero-block__subheading lead">{{ subheading }}</p>
    }
    @if (link(); as link) {
      <novan-block-action [link]="link" [on]="actionOn()" />
    }
  </div>
</section>
