<div class="mb-3">
  <span class="form-label d-block" [id]="labelId()">
    {{ field().label }}
    @if (field().required) {
      <span class="text-body-secondary">(required)</span>
    }
  </span>

  @if (tools().length && !disabled()) {
    <div
      #toolbar
      role="toolbar"
      class="d-flex flex-wrap gap-1 mb-1"
      [attr.aria-label]="'Formatting for ' + field().label"
      [attr.aria-controls]="id()"
    >
      @for (tool of tools(); track tool.key; let i = $index) {
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-secondary]="!isActive(tool)"
          [class.btn-primary]="isActive(tool)"
          [title]="tool.label"
          [tabIndex]="i === focusIndex() ? 0 : -1"
          [attr.aria-pressed]="tool.toggle ? isActive(tool) : null"
          (focus)="focusIndex.set(i)"
          (keydown)="onToolbarKey($event)"
          (click)="apply(tool)"
        >
          <i [class]="'bi bi-' + tool.icon" aria-hidden="true"></i>
          <span class="visually-hidden">{{ tool.label }}</span>
        </button>
      }
    </div>
  }

  @if (linkEditing()) {
    <div class="border rounded p-2 mb-1" role="group" [attr.aria-label]="'Link in ' + field().label">
      <label class="form-label" [for]="id() + '-link-href'">Link address</label>
      <div class="d-flex flex-wrap gap-2">
        <input
          type="url"
          inputmode="url"
          class="form-control flex-grow-1 w-auto"
          [id]="id() + '-link-href'"
          [class.is-invalid]="linkError()"
          [value]="linkHref()"
          [attr.aria-describedby]="id() + '-link-help' + (linkError() ? ' ' + id() + '-link-error' : '')"
          [attr.aria-invalid]="linkError() ? true : null"
          (input)="setLinkHref($event)"
          (keydown.enter)="$event.preventDefault(); saveLink()"
          (keydown.escape)="$event.preventDefault(); cancelLink()"
        />
        <button type="button" class="btn btn-sm btn-primary" (click)="saveLink()">Apply</button>
        <button type="button" class="btn btn-sm btn-danger" (click)="removeLink()">Remove link</button>
        <button type="button" class="btn btn-sm btn-secondary" (click)="cancelLink()">Cancel</button>
      </div>
      <nv-field-messages
        help="A web address like https://example.com, or a page address like /about."
        [helpId]="id() + '-link-help'"
        [errors]="linkErrors()"
        [errorId]="id() + '-link-error'"
      />
    </div>
  }

  <div #editorHost></div>
  <nv-field-messages [help]="field().help" [helpId]="helpId()" [errors]="errors()" [errorId]="errorId()" />
</div>
