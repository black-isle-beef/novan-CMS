<div class="mb-3">
  <label class="form-label" [for]="id()">
    {{ field().label }}
    @if (field().required) {
      <span class="text-body-secondary">(required)</span>
    }
  </label>
  <textarea
    class="form-control font-monospace"
    rows="6"
    spellcheck="false"
    [id]="id()"
    [class.is-invalid]="showsError()"
    [value]="text()"
    [disabled]="disabled()"
    [attr.aria-describedby]="describedByAll()"
    [attr.aria-invalid]="showsError() || null"
    [attr.aria-required]="field().required || null"
    (input)="set($event)"
  ></textarea>
  <nv-field-messages [help]="field().help" [helpId]="helpId()" [errors]="allErrors()" [errorId]="errorId()" />
</div>
