@if (field().multiple) {
  <fieldset class="mb-3" [id]="id()" tabindex="-1" [attr.aria-describedby]="describedBy()">
    <legend class="form-label fs-6 mb-1">
      {{ field().label }}
      @if (field().required) {
        <span class="text-body-secondary">(required)</span>
      }
    </legend>
    @for (option of options(); track option.id) {
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input"
          [id]="id() + '-' + option.id"
          [class.is-invalid]="invalid()"
          [checked]="chosen().includes(option.id)"
          [disabled]="disabled()"
          (change)="toggle(option.id, $event)"
        />
        <label class="form-check-label" [for]="id() + '-' + option.id">
          {{ option.title }} <span class="text-body-secondary">{{ option.path }}</span>
        </label>
      </div>
    } @empty {
      <p class="text-body-secondary mb-0">There is nothing to choose from yet.</p>
    }
    <nv-field-messages [help]="field().help" [helpId]="helpId()" [errors]="errors()" [errorId]="errorId()" />
  </fieldset>
} @else {
  <div class="mb-3">
    <label class="form-label" [for]="id()">
      {{ field().label }}
      @if (field().required) {
        <span class="text-body-secondary">(required)</span>
      }
    </label>
    <select
      class="form-select"
      [id]="id()"
      [class.is-invalid]="invalid()"
      [disabled]="disabled()"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-invalid]="invalid() || null"
      [attr.aria-required]="field().required || null"
      (change)="choose($event)"
    >
      <option value="" [selected]="!selected()">None</option>
      @for (option of options(); track option.id) {
        <option [value]="option.id" [selected]="selected() === option.id">{{ option.title }} ({{ option.path }})</option>
      }
    </select>
    <nv-field-messages [help]="field().help" [helpId]="helpId()" [errors]="errors()" [errorId]="errorId()" />
  </div>
}
