@if (translated()) {
  @let shown = locale();
  @if (compare(); as source) {
    <div class="row g-3">
      <div class="col-md-6">
        <nv-field-input [field]="fieldIn(source)" [path]="pathIn(source)" [value]="valueIn(source)" [locale]="source" [locked]="true" />
      </div>
      <div class="col-md-6">
        <nv-field-input [field]="fieldIn(shown)" [path]="pathIn(shown)" [value]="valueIn(shown)" (valueChange)="setIn(shown, $event)" [locale]="shown" />
      </div>
    </div>
  } @else {
    <nv-field-input [field]="fieldIn(shown)" [path]="pathIn(shown)" [value]="valueIn(shown)" (valueChange)="setIn(shown, $event)" [locale]="shown" />
  }
} @else {
  <nv-field-input [field]="field()" [path]="path()" [(value)]="value" />
}
