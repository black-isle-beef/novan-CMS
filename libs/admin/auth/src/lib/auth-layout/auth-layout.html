<!-- `#ds-main-content` is the target of the header's "Skip to main content" link. -->
<ds-header [navItems]="navItems">
  <strong dsBrand>Novan CMS</strong>
</ds-header>

<main id="ds-main-content" class="container py-11">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <h1 class="mb-4">{{ heading() }}</h1>
      <ng-content />
    </div>
  </div>
</main>
