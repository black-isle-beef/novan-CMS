<nv-auth-layout heading="Choose a new password">
  @if (auth.signedIn()) {
    <nv-set-password-form submitLabel="Save new password" (saved)="saved()" />
  } @else {
    <p>This reset link is invalid or has expired.</p>
    <p class="mb-0"><a routerLink="/forgot-password">Send a new reset link</a></p>
  }
</nv-auth-layout>
