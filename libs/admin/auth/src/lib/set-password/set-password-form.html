@if (error(); as message) {
  <ds-alert variant="danger" class="mb-4">{{ message }}</ds-alert>
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="mb-3">
    <label for="new-password" class="form-label">New password</label>
    <input
      id="new-password"
      type="password"
      class="form-control"
      formControlName="password"
      autocomplete="new-password"
      required
      [attr.minlength]="minLength"
      aria-describedby="new-password-hint"
      [class.is-invalid]="passwordInvalid()"
      [attr.aria-invalid]="passwordInvalid()"
    />
    <div id="new-password-hint" [class]="passwordInvalid() ? 'invalid-feedback' : 'form-text'">
      {{ passwordInvalid() ? 'Use at least ' + minLength + ' characters.' : 'At least ' + minLength + ' characters.' }}
    </div>
  </div>

  <div class="mb-4">
    <label for="confirm-password" class="form-label">Confirm new password</label>
    <input
      id="confirm-password"
      type="password"
      class="form-control"
      formControlName="confirm"
      autocomplete="new-password"
      required
      [class.is-invalid]="confirmInvalid()"
      [attr.aria-invalid]="confirmInvalid()"
      [attr.aria-describedby]="confirmInvalid() ? 'confirm-password-error' : null"
    />
    @if (confirmInvalid()) {
      <div id="confirm-password-error" class="invalid-feedback">The passwords do not match.</div>
    }
  </div>

  <button type="submit" class="btn btn-primary w-100" [disabled]="busy()" [attr.aria-busy]="busy()">
    {{ submitLabel() }}
  </button>
</form>
