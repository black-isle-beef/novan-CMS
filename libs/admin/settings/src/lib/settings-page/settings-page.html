<h1 class="mb-1">{{ copy.settings }}</h1>
<p class="lead text-body-secondary mb-4">How your site is set up, and who can change it.</p>

<ul class="list-unstyled row g-4">
  @for (item of links(); track item.title) {
    <li class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h2 class="h5 card-title"><a [routerLink]="item.link">{{ item.title }}</a></h2>
          <p class="card-text mb-0">{{ item.description }}</p>
        </div>
      </div>
    </li>
  }
</ul>
