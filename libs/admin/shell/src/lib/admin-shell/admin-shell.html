<!-- `#ds-main-content` is the target of the header's "Skip to main content" link. -->
<ds-header variant="app" [navItems]="headerNav()">
  <a dsBrand routerLink="/spaces" class="nv-brand" aria-label="Novan CMS, all spaces">
    <img src="logos/compass-mark-white.svg" alt="" class="nv-brand__mark" />
    <img src="logos/novan-word-white.png" alt="" class="nv-brand__word" />
    <span class="nv-brand__tag" aria-hidden="true">CMS</span>
  </a>
  <ng-container dsActions>
    @if (spaceId()) {
      <button type="button" class="btn btn-secondary btn-sm nv-header-search" [attr.aria-keyshortcuts]="searchKeys" (click)="openSearch()">
        <span class="bi bi-search" aria-hidden="true"></span>
        <span class="nv-header-search__label">Search</span>
        <kbd class="nv-kbd" aria-hidden="true">Ctrl K</kbd>
        <span class="visually-hidden"> (Ctrl+K)</span>
      </button>
    }
    <nv-space-switcher />
    @if (viewAsSpaceId(); as id) {
      <nv-view-as-menu [spaceId]="id" />
    }
    <!-- Sign out is the second item: the menu opens on Account, and one Down arrow (or Up from the button) reaches it. -->
    <ds-dropdown class="nv-account-menu" label="Account" position="bottom-end">
      <span dsDropdownTrigger>
        <span class="nv-account-chip" aria-hidden="true">{{ initials() }}</span>
        <span class="visually-hidden">Account and sign out</span>
      </span>
      <ds-menu-item (activated)="openAccount()">Account</ds-menu-item>
      <ds-menu-item (activated)="signOut()">Sign out</ds-menu-item>
    </ds-dropdown>
  </ng-container>
</ds-header>

<!-- Only <main> scrolls; the header and the space menu stay in view (apps/admin/src/styles/_shell.scss). -->
<div class="nv-shell__body">
  @if (spaceNav().length && !narrow() ? spaceId() : null; as id) {
    <nv-space-sidebar [items]="spaceNav()" [spaceId]="id" [url]="url()" />
  }
  <main #main id="ds-main-content" class="nv-shell__main">
    <div [class]="wide() ? 'container-fluid py-3' : 'container py-6'">
      @if (context.viewingAs(); as role) {
        <nv-view-as-banner [role]="role" />
      }
      <router-outlet />
    </div>
  </main>
</div>

@if (spaceId(); as id) {
  <nv-search-palette [spaceId]="id" />
}
<ds-toast-container position="bottom-end" />
<nv-confirm-host />
