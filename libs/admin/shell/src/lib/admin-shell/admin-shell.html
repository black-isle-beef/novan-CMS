<!-- `#ds-main-content` is the target of the header's "Skip to main content" link. -->
<ds-header [navItems]="headerNav()">
  <a dsBrand routerLink="/spaces" class="fw-bold text-body text-decoration-none">Novan CMS</a>
  <ng-container dsActions>
    @if (spaceId()) {
      <button type="button" class="btn btn-secondary btn-sm" [attr.aria-keyshortcuts]="searchKeys" (click)="openSearch()">
        <span class="bi bi-search" aria-hidden="true"></span> Search<span class="visually-hidden"> (Ctrl+K)</span>
      </button>
    }
    <nv-space-switcher />
    @if (viewAsSpaceId(); as id) {
      <nv-view-as-menu [spaceId]="id" />
    }
    <ds-button variant="secondary" size="sm" (pressed)="signOut()">Sign out</ds-button>
  </ng-container>
</ds-header>

<!-- Only <main> scrolls; the header and the space menu stay in view (apps/admin/src/styles/_shell.scss). -->
<div class="nv-shell__body">
  @if (spaceNav().length && !narrow()) {
    <ds-sidebar [items]="spaceNav()" ariaLabel="Space" />
  }
  <main #main id="ds-main-content" class="nv-shell__main flex-grow-1">
    <div class="container py-6">
      @if (context.viewingAs(); as role) {
        <nv-view-as-banner [role]="role" />
      }
      <router-outlet />
    </div>
  </main>
</div>

@if (spaceId(); as id) {
  <nv-search-palette [spaceId]="id" />
}
<ds-toast-container position="bottom-end" />
<nv-confirm-host />
