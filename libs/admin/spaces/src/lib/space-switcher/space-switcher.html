<ds-dropdown label="Switch space" position="bottom-end">
  <span dsDropdownTrigger>
    <span class="visually-hidden">Space: </span>{{ context.currentSpace()?.name ?? 'Choose a space' }}
    <i class="bi bi-chevron-down ms-1" aria-hidden="true"></i>
  </span>

  @for (space of context.spaces() ?? []; track space.id) {
    <ds-menu-item (activated)="open(['/spaces', space.id])">
      {{ space.name }}
      @if (space.id === context.currentSpaceId()) {
        <i class="bi bi-check2 ms-2" aria-hidden="true"></i><span class="visually-hidden"> (current)</span>
      }
    </ds-menu-item>
  }
  <ds-menu-item (activated)="open(['/spaces'])">All spaces</ds-menu-item>
  @if (auth.agencyStaff()) {
    <ds-menu-item (activated)="open(['/spaces', 'new'])">Create a space</ds-menu-item>
  }
</ds-dropdown>
